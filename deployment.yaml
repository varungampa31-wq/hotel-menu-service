apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-menu-service
  namespace: hotel-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hotel-menu-service
  template:
    metadata:
      labels:
        app: hotel-menu-service
    spec:
      containers:
        - name: hotel-menu-service
          image: varun3214/hotel-menu-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
